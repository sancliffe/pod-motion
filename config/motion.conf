# ==========================================
# Minimal Motion Configuration
# ==========================================

# 1. Logging & System
log_level 6
log_type all

# 2. Storage Directory
# Updated to match the container's internal mount point (/var/lib/motion)
target_dir /var/lib/motion

# 3. Web Control Panel
webcontrol_port 7999
webcontrol_localhost off
webcontrol_parms 0

# 4. Live Stream Port
stream_port 8081
stream_localhost off

# 5. Camera Configuration
camera_name MyCamera
camera_id 1

video_device /dev/video0
# Removed v4l2_palette to allow Motion to auto-detect MJPG format
# MJPG is required to achieve 30 fps at 1280x720 on this hardware

# ==========================================
# Webcam Resolution & Quality Settings
# ==========================================

width 1280
height 720
framerate 30

picture_quality 100

# ==========================================
# Video Capture Settings
# ==========================================

movie_output on
movie_codec mkv
movie_max_time 60
picture_output off
